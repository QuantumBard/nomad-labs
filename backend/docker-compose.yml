version: '3.8'

services:
  # PostgreSQL Database (Optional - only if not using Supabase)
  # Uncomment this if you want to use local PostgreSQL instead of Supabase
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: flight-fare-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: flightfare
  #     POSTGRES_PASSWORD: flightfare_secret
  #     POSTGRES_DB: flight_fare_db
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U flightfare -d flight_fare_db"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - flight-fare-network

  # Redis Cache & Queue (Optional - only if not using Upstash)
  # Uncomment this if you want to use local Redis instead of Upstash
  # redis:
  #   image: redis:7-alpine
  #   container_name: flight-fare-redis
  #   restart: unless-stopped
  #   command: redis-server --appendonly yes
  #   volumes:
  #     - redis_data:/data
  #   ports:
  #     - "6379:6379"
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - flight-fare-network

  # Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flight-fare-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      # Supabase PostgreSQL (Primary - hosted)
      # Get this from Supabase Dashboard → Settings → Database → Connection string
      DATABASE_URL: ${DATABASE_URL}
      # Legacy local PostgreSQL (Fallback - uncomment below if using local postgres service)
      # DATABASE_URL: postgresql://flightfare:flightfare_secret@postgres:5432/flight_fare_db?schema=public
      # Upstash Redis (Primary - serverless via REST API)
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
      # Legacy Redis (Fallback - uncomment below if using local redis service)
      # REDIS_HOST: redis
      # REDIS_PORT: 6379
      # REDIS_PASSWORD: ""
      # REDIS_DB: 0
      AMADEUS_API_KEY: ${AMADEUS_API_KEY:-}
      AMADEUS_API_SECRET: ${AMADEUS_API_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
    ports:
      - "3001:3001"
    # Uncomment below if using local PostgreSQL
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #   redis:
    #     condition: service_healthy
    networks:
      - flight-fare-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/v1/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  # Uncomment if using local PostgreSQL
  # postgres_data:
  #   driver: local
  # Uncomment if using local Redis
  # redis_data:
  #   driver: local

networks:
  flight-fare-network:
    driver: bridge
